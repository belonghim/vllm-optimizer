# ═══════════════════════════════════════════════════════════════════════════════
# 05-monitoring.yaml
# OpenShift Monitoring Stack 연동
# - ServiceMonitor (Prometheus Operator)
# - PrometheusRule (알람 규칙)
# ═══════════════════════════════════════════════════════════════════════════════

# ── ServiceMonitor: Backend 메트릭 수집 ───────────────────────────────────────
# openshift-monitoring의 Prometheus가 자동으로 이 ServiceMonitor를 감지
# Namespace에 openshift.io/cluster-monitoring: "true" 레이블 필요
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-optimizer-backend
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vllm-optimizer
    # OpenShift Monitoring이 이 레이블로 ServiceMonitor를 감지
    openshift.io/cluster-monitoring: "true"
spec:
   selector:
     matchLabels:
       app: vllm-optimizer-backend
   endpoints:
   - port: http
     path: /api/metrics
     interval: 15s
     scrapeTimeout: 10s
     scheme: http
---
# ── PrometheusRule: 알람 규칙 ─────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-optimizer-alerts
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vllm-optimizer
    openshift.io/cluster-monitoring: "true"
    # Prometheus Operator가 이 레이블로 Rule 감지
    role: alert-rules
spec:
  groups:
    # ── vLLM Optimizer 앱 알람 ───────────────────────────────────────────────
    - name: vllm-optimizer.app
      rules:
        - alert: OptimizerBackendDown
          expr: |
            up{job="vllm-optimizer-backend"} == 0
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "vLLM Optimizer Backend 다운"
            description: "Optimizer Backend Pod가 응답하지 않습니다."

    # ── vLLM Optimizer 인프라 알람 ───────────────────────────────────────────
    - name: vllm-optimizer.infra
      rules:
        - alert: VllmOptimizerPVCDiskUsageHigh
          # Threshold (0.8 = 80%) can be tuned per environment via Kustomize patch
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"vllm-optimizer.*"}
            /
            kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"vllm-optimizer.*"}
            > 0.8
          for: 5m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "vLLM Optimizer PVC 디스크 사용량 80% 초과"
            description: |
              PVC {{ $labels.persistentvolumeclaim }} 사용량이
              {{ $value | humanizePercentage }}로 80% 임계치를 초과했습니다.
              SQLite DB 파일 정리를 고려하세요.

---
# ── NetworkPolicy: 최소 권한 네트워크 접근 ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-optimizer-backend-netpol
  labels:
    app.kubernetes.io/part-of: vllm-optimizer
spec:
  podSelector:
    matchLabels:
      app: vllm-optimizer-backend
  policyTypes:
    - Ingress
  ingress:
    # allow-from-same-namespace
    - from:
        - podSelector: {}
      ports:
        - port: 8000
    # allow-from-openshift-ingress
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8000
    # allow-from-openshift-monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - port: 8000
    # allow-from-kube-apiserver-operator
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-kube-apiserver
      ports:
        - port: 8000

---
# ── NetworkPolicy: Frontend (oauth-proxy + nginx) ─────────────────────────────
# podSelector만 사용하여 모든 포트 허용 (8080 nginx, 4180 oauth-proxy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-optimizer-frontend-netpol
spec:
  podSelector:
    matchLabels:
      app: vllm-optimizer-frontend
  policyTypes:
    - Ingress
  ingress:
    # allow-from-same-namespace (모든 포트)
    - from:
        - podSelector: {}
    # allow-from-openshift-ingress (모든 포트 - Route에서 4180 접근)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    # allow-from-openshift-monitoring (모든 포트)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
    # allow-from-kube-apiserver-operator (모든 포트)
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-kube-apiserver-operator
                  - kube-apiserver-operator
