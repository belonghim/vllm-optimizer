apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm-ov
  namespace: PLACEHOLDER_VLLM_NS
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-openvino-runtime
      storageUri: oci://quay.io/joopark/ai1/modelcar-qwen3.5-2b-int4-ov
      args:
        - --served-model-name=OpenVINO/Qwen3.5-2B-int4-ov
        # Qwen3.5 is hybrid (GDN): OpenVINO reserves linear state per max_num_seqs slot from the 4 GiB KV space;
        # 256 slots leave 0 KV blocks and the engine fails to start.
        - --max-num-seqs=32
        - --gpu-memory-utilization=0.90
        - --max-model-len=8192
        # llm-ov is also used as the analyst LLM — pin sampling to greedy for deterministic output.
        - '--override-generation-config={"temperature":0}'
        - --enable-prefix-caching
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "8"
          memory: "16Gi"
